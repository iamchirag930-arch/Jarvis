<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Voice Assistant (Netlify Secure)</title>
    <link rel="icon" type="image/png" href="/favicon.png"> 
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        /* New Animated Button CSS */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;width:100%;overflow:hidden;font-family:'Orbitron',sans-serif}
        body{background:linear-gradient(135deg,#0c0c1e 0%,#1a1a3e 50%,#0c0c1e 100%);display:flex;justify-content:center;align-items:center;position:relative}
        #animationContainer{position:relative;width:500px;height:500px;display:flex;justify-content:center;align-items:center}
        #videoSizer{position:relative;width:100%;padding-bottom:100%;overflow:hidden;border-radius:50%;box-shadow:0 0 60px rgba(0,191,255,0.3),0 0 100px rgba(0,191,255,0.1),inset 0 0 60px rgba(0,191,255,0.1)}
        .assistant-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.5s ease-in-out;border-radius:50%}
        .assistant-video.is-active{opacity:1}
        #userVideo{position:fixed;top:20px;right:20px;width:180px;height:135px;border-radius:15px;border:3px solid #28a745;box-shadow:0 0 20px rgba(40,167,69,0.6),0 0 40px rgba(40,167,69,0.3);object-fit:cover;transform:scaleX(-1);display:none;z-index:100;background:#000}
        #userVideo.active{display:block;animation:fadeInScale 0.5s ease-out}
        @keyframes fadeInScale{from{opacity:0;transform:scaleX(-1) scale(0.8)}to{opacity:1;transform:scaleX(-1) scale(1)}}
        
        /* Enhanced Button Styling: Added space for 3 buttons */
        .button-container{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:30px;z-index:100}
        .ai-button{
            width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;
            font-size:30px;display:flex;justify-content:center;align-items:center;
            transition:all 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.3);
            position:relative;overflow:hidden;background:rgba(20,20,40,0.8);
            color:#fff;
        }
        .ai-button:before {
            content:'';position:absolute;top:50%;left:50%;width:300%;height:300%;
            background-color:rgba(255,255,255,0.15);
            transition:all 0.5s ease;transform:translate(-50%,-50%) rotate(45deg);
        }
        .ai-button:hover:before {
            transform:translate(-50%,-50%) rotate(45deg) scale(0);
        }
        .ai-button:hover{transform:scale(1.05);}
        .icon-content{z-index:1;transition:transform 0.3s ease;}
        
        /* Main Button States (Green/Red/Cancel) */
        #mainButton {box-shadow:0 0 25px rgba(40,167,69,0.5);}
        #mainButton.listening {
            animation:pulse-listen 1.5s infinite;
            box-shadow:0 0 30px rgba(220,53,69,0.8);
        }
        #mainButton.speaking {
            background:linear-gradient(145deg, #dc3545, #c82333);
            box-shadow:0 0 30px rgba(220,53,69,0.8);
        }
        #mainButton.speaking:hover {
            animation: none;
        }

        /* Video Button States (Blue/Yellow) */
        #videoCallButton {box-shadow:0 0 25px rgba(0,123,255,0.5);}
        #videoCallButton.active {
            box-shadow:0 0 30px rgba(255,193,7,0.8);
        }

        /* Camera Switch Button Styling */
        #cameraSwitchButton {
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5); /* Violet glow */
            color: #8A2BE2;
            background: rgba(20, 20, 40, 0.8);
        }
        #cameraSwitchButton:hover {
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.8);
        }
        
        @keyframes pulse-listen{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

        #statusText{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);color:#00bfff;font-size:14px;text-align:center;text-transform:uppercase;letter-spacing:2px;opacity:0.8;text-shadow:0 0 10px rgba(0,191,255,0.5)}
        #transcriptBox{position:fixed;top:20px;left:20px;max-width:300px;padding:15px 20px;background:rgba(0,0,0,0.7);border:1px solid rgba(0,191,255,0.3);border-radius:10px;color:#00bfff;font-size:12px;display:none;backdrop-filter:blur(10px)}
        #transcriptBox.active{display:block;animation:slideIn 0.3s ease-out}
        @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
        .glow-ring{position:absolute;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(0,191,255,0.2);animation:rotateGlow 10s linear infinite;pointer-events:none}
        .glow-ring::before{content:'';position:absolute;top:-2px;left:50%;width:20px;height:20px;background:#00bfff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 20px #00bfff,0 0 40px #00bfff}
        @keyframes rotateGlow{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
        .corner-decoration{position:fixed;width:100px;height:100px;pointer-events:none;opacity:0.3}
        .corner-decoration.top-left{top:0;left:0;border-top:2px solid #00bfff;border-left:2px solid #00bfff}
        .corner-decoration.top-right{top:0;right:0;border-top:2px solid #00bfff;border-right:2px solid #00bfff}
        .corner-decoration.bottom-left{bottom:0;left:0;border-bottom:2px solid #00bfff;border-left:2px solid #00bfff}
        .corner-decoration.bottom-right{bottom:0;right:0;border-bottom:2px solid #00bfff;border-right:2px solid #00bfff}
        #dev-attribution{position:fixed;bottom:10px;right:10px;font-size:10px;opacity:0.6;z-index:1000}
        #dev-attribution a{color:#00bfff;text-decoration:none;transition:opacity 0.3s}
        #dev-attribution a:hover{opacity:1}
        #loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(12,12,30,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.5s}
        #loadingOverlay.hidden{opacity:0;pointer-events:none}
        .loader{width:60px;height:60px;border:3px solid rgba(0,191,255,0.1);border-top-color:#00bfff;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        #loadingText{margin-top:20px;color:#00bfff;font-size:14px;letter-spacing:2px}
        @media(max-width:768px){#animationContainer{width:100vw;height:100vw;max-width:100%;max-height:100vh}#videoSizer{border-radius:0}#userVideo{width:120px;height:90px;top:10px;right:10px}#mainButton,.ai-button{width:65px;height:65px;font-size:24px}.button-container{bottom:30px;gap:20px}.glow-ring{display:none}#transcriptBox{max-width:calc(100% - 150px);font-size:11px}}
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText">INITIALIZING JARVIS...</div>
    </div>
    <div class="corner-decoration top-left"></div>
    <div class="corner-decoration top-right"></div>
    <div class="corner-decoration bottom-left"></div>
    <div class="corner-decoration bottom-right"></div>
    <div id="animationContainer">
        <div class="glow-ring"></div>
        <div id="videoSizer">
            <video id="silentVideo" class="assistant-video is-active" loop muted playsinline src="assets/silent.mp4#t=1"></video>
            <video id="thinkVideo" class="assistant-video" loop muted playsinline src="assets/think.mp4"></video>
            <video id="speakVideo" class="assistant-video" loop muted playsinline src="assets/speak.mp4"></video>
        </div>
    </div>
    <video id="userVideo" autoplay playsinline></video>
    <div id="transcriptBox"></div>
    <div id="statusText">Ready</div>
    <div class="button-container">
        <button id="mainButton" class="ai-button">
            <i class="icon-content fas fa-microphone"></i>
        </button>
        <button id="videoCallButton" class="ai-button">
            <i class="icon-content fas fa-video"></i>
        </button>
        <button id="cameraSwitchButton" class="ai-button" style="display:none;">
            <i class="icon-content fas fa-sync-alt"></i>
        </button>
    </div>
    <div id="dev-attribution"></div>
    <script>
        
        const silentVideo = document.getElementById('silentVideo');
        const thinkVideo = document.getElementById('thinkVideo');
        const speakVideo = document.getElementById('speakVideo');
        const userVideo = document.getElementById('userVideo');
        const mainButton = document.getElementById('mainButton');
        const videoCallButton = document.getElementById('videoCallButton');
        const cameraSwitchButton = document.getElementById('cameraSwitchButton'); // New button element
        const statusText = document.getElementById('statusText');
        const transcriptBox = document.getElementById('transcriptBox');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const mainButtonIcon = mainButton.querySelector('.icon-content'); 
        let synthesis = window.speechSynthesis;
        let recognition = null;
        let isFirstClick = true;
        let isListening = false;
        let isSpeaking = false; 
        let videoStream = null;
        let cocoModel = null;
        let isVideoCallActive = false;

        // Conversation History and Camera State
        const HISTORY_KEY = 'jarvisChatHistory';
        let chatHistory = JSON.parse(sessionStorage.getItem(HISTORY_KEY)) || [];
        let currentFacingMode = 'user'; // Start with the front camera

        function saveHistory(role, text) {
            if (chatHistory.length > 10) { 
                chatHistory.shift(); 
            }
            chatHistory.push({ role: role === 'user' ? 'user' : 'model', text: text });
            sessionStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory));
        }

        function setAnimationState(state) {
            silentVideo.classList.remove('is-active');
            thinkVideo.classList.remove('is-active');
            speakVideo.classList.remove('is-active');
            silentVideo.pause();
            thinkVideo.pause();
            speakVideo.pause();
            
            if (state === 'silent') {
                silentVideo.classList.add('is-active');
                silentVideo.play().catch(() => {});
            } else if (state === 'think') {
                thinkVideo.classList.add('is-active');
                thinkVideo.currentTime = 0;
                thinkVideo.play().catch(() => {});
            } else if (state === 'speak') {
                speakVideo.classList.add('is-active');
                speakVideo.play().catch(() => {});
            }
        }

        function getHindiVoice() {
            const voices = synthesis.getVoices();
            let hindiVoice = voices.find(v => v.lang.includes('hi'));
            if (!hindiVoice) hindiVoice = voices.find(v => v.lang.includes('en-IN'));
            if (!hindiVoice) hindiVoice = voices[0];
            return hindiVoice;
        }

        function speak(text, callback) {
            synthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = getHindiVoice();
            utterance.lang = 'hi-IN';
            utterance.rate = 0.95;
            utterance.pitch = 1;

            utterance.onstart = () => {
                isSpeaking = true;
                setAnimationState('speak');
                statusText.textContent = 'Speaking...';
                
                mainButton.classList.add('speaking');
                mainButtonIcon.className = 'icon-content fas fa-times'; 
            };

            const endAction = () => {
                if (isSpeaking) { 
                    saveHistory('model', text); 
                }
                isSpeaking = false;
                mainButton.classList.remove('speaking');
                mainButtonIcon.className = 'icon-content fas fa-microphone'; 
                setAnimationState('silent');
                statusText.textContent = 'Ready';
                if (callback) callback();
            };

            utterance.onend = endAction;
            utterance.onerror = endAction;
            
            synthesis.speak(utterance);
        }
        
        function stopSpeaking() {
            if (isSpeaking) {
                synthesis.cancel();
                isSpeaking = false;
                mainButton.classList.remove('speaking');
                mainButtonIcon.className = 'icon-content fas fa-microphone'; 
                setAnimationState('silent');
                statusText.textContent = 'Ready';
            }
        }

        function initRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('आपका ब्राउज़र Speech Recognition को सपोर्ट नहीं करता');
                return false;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.onstart = () => {
                isListening = true;
                mainButton.classList.add('listening');
                statusText.textContent = 'Listening...';
                mainButtonIcon.className = 'icon-content fas fa-microphone-slash'; 
            };
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptBox.textContent = transcript;
                transcriptBox.classList.add('active');
                if (event.results[event.results.length - 1].isFinal) {
                    handleCommand(transcript.trim().toLowerCase());
                }
            };
            recognition.onend = () => {
                isListening = false;
                mainButton.classList.remove('listening');
                mainButtonIcon.className = 'icon-content fas fa-microphone';
                if (statusText.textContent === 'Listening...') {
                    statusText.textContent = 'Ready';
                    setAnimationState('silent');
                }
            };
            recognition.onerror = (event) => {
                isListening = false;
                mainButton.classList.remove('listening');
                mainButtonIcon.className = 'icon-content fas fa-microphone';
                statusText.textContent = 'Ready';
                setAnimationState('silent');
            };
            return true;
        }

        function startListening() {
            if (!recognition && !initRecognition()) return;
            try {
                recognition.start();
            } catch (e) {}
        }

        function stopListening() {
            if (recognition && isListening) {
                recognition.stop();
            }
        }

        async function handleCommand(command) {
            transcriptBox.classList.remove('active');
            
            saveHistory('user', command);
            
            setAnimationState('think');
            statusText.textContent = 'Processing...';

            // --- Local Commands ---
            if (command.includes('नमस्ते') || command.includes('हेलो') || command.includes('हाय')) {
                speak('नमस्ते! आज मैं आपकी क्या मदद कर सकती हूं?');
                return;
            }
            if (command.includes('नाम') || command.includes('कौन हो') || command.includes('who are you') || command.includes('your name')) {
                speak('मैं जार्विस हूं, मुझे चिराग सर ने बनाया है।');
                return;
            }
            if (command.includes('टाइम') || command.includes('समय') || command.includes('time')) {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const timeStr = `अभी ${hours} बजकर ${minutes} मिनट हुए हैं`;
                speak(timeStr);
                return;
            }
            if (command.includes('डेट') || command.includes('तारीख') || command.includes('date')) {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const dateStr = now.toLocaleDateString('hi-IN', options);
                speak(`आज की तारीख है ${dateStr}`);
                return;
            }
            if (command.includes('धन्यवाद') || command.includes('शुक्रिया') || command.includes('thank')) {
                speak('आपका स्वागत है! मुझे खुशी है कि मैं आपकी मदद कर सकी।');
                return;
            }
            if (command.includes('कैसे हो') || command.includes('कैसा है') || command.includes('how are you')) {
                speak('मैं बिल्कुल ठीक हूं, धन्यवाद पूछने के लिए! आप बताइए, आप कैसे हैं?');
                return;
            }

            // --- Vision Command ---
            if (command.includes('देखो') || command.includes('सामने') || command.includes('क्या दिख') || command.includes('what do you see')) {
                if (isVideoCallActive && cocoModel) {
                    await queryWithLocalVision(command);
                } else {
                    speak('वीडियो कॉल चालू करें ताकि मैं देख सकूं।');
                }
                return;
            }
            
            // --- General Command (Netlify Function call) ---
            await queryGemini(command);
        }

        async function queryGemini(prompt, visionData = null) {
            statusText.textContent = 'Thinking...';
            
            try {
                const api_url = '/.netlify/functions/chat-proxy'; 

                const response = await fetch(api_url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt, 
                        visionData: visionData,
                        history: chatHistory
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    console.error('API Error:', data.error);
                    speak('माफ़ करें, AI सेवा में त्रुटि आई है: ' + data.error);
                }
                else if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    speak(data.candidates[0].content.parts[0].text);
                } else {
                    speak('माफ़ करें, मुझे समझ नहीं आया। कृपया दोबारा कहें।');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                speak('माफ़ करें, नेटवर्क में कोई समस्या है या Serverless Function tak pahunchne mein dikkat hai.');
            }
            setAnimationState('silent');
        }

        async function queryWithLocalVision(prompt) {
            try {
                statusText.textContent = 'Analyzing...';
                const canvas = document.createElement('canvas');
                canvas.width = userVideo.videoWidth;
                canvas.height = userVideo.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(userVideo, 0, 0);
                const predictions = await cocoModel.detect(canvas);
                let detectedObjects = predictions.map(p => p.class).join(', ');
                
                let visionData = detectedObjects || 'कुछ विशेष नहीं दिख रहा';
                
                await queryGemini(prompt, visionData); 
            } catch (error) {
                speak('माफ़ करें, कुछ समस्या है देखने में।');
            }
        }
        
        // 🚨 NEW FUNCTION: Stream ko start karne ke liye helper function
        async function startVideoStream(facingMode) {
            try {
                statusText.textContent = `Loading ${facingMode === 'user' ? 'front' : 'back'} camera...`;
                
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                    videoStream = null;
                }

                // Request new stream with constraints
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: false 
                });

                userVideo.srcObject = videoStream;
                currentFacingMode = facingMode; 
                
                userVideo.classList.add('active');
                videoCallButton.classList.add('active');
                cameraSwitchButton.style.display = 'flex'; // Show switch button
                isVideoCallActive = true;

                if (!cocoModel) {
                    statusText.textContent = 'Loading vision...';
                    cocoModel = await cocoSsd.load();
                }
                
                statusText.textContent = 'Ready';
                speak('कैमरा चालू हो गया। अब मैं देख सकती हूं।', () => {});

            } catch (error) {
                speak('माफ़ करें, कैमरा एक्सेस नहीं मिल सका या कैमरे में कोई समस्या है।');
                statusText.textContent = 'Ready';
                cameraSwitchButton.style.display = 'none';
                isVideoCallActive = false;
                throw error; 
            }
        }
        
        // 🚨 NEW FUNCTION: Switch camera logic
        async function switchCamera() {
            if (!isVideoCallActive) return; 

            stopSpeaking(); 
            statusText.textContent = 'Switching camera...';
            
            const newFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

            await startVideoStream(newFacingMode).catch((e) => {
                // Agar switch fail hota hai, toh existing mode par hi rahein
                statusText.textContent = 'Switch Failed: Only one camera found.';
                console.error("Camera switch error:", e);
            });
        }
        
        async function toggleVideoCall() {
            if (!isVideoCallActive) {
                // Start video call (default to current facing mode)
                await startVideoStream(currentFacingMode).catch(() => {});
                
            } else {
                // Stop video call
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                    videoStream = null;
                }
                userVideo.srcObject = null;
                userVideo.classList.remove('active');
                videoCallButton.classList.remove('active');
                cameraSwitchButton.style.display = 'none'; // Hide switch button
                isVideoCallActive = false;
                speak('कैमरा बंद हो गया।');
            }
        }

        // --- Event Listeners ---
        mainButton.addEventListener('click', () => {
            if (isSpeaking) {
                stopSpeaking(); 
                return;
            }
            if (isListening) {
                stopListening(); 
                return;
            }
            if (isFirstClick) {
                isFirstClick = false;
                speak('नमस्कार! बोलिए, मैं सुन रही हूं।', () => {
                    startListening();
                });
            } else {
                startListening();
            }
        });

        videoCallButton.addEventListener('click', toggleVideoCall);
        cameraSwitchButton.addEventListener('click', switchCamera); // New listener

        window.onload = async () => {
            if (synthesis.onvoiceschanged !== undefined) {
                synthesis.onvoiceschanged = () => {};
            }
            synthesis.getVoices();
            setAnimationState('silent');
            silentVideo.play().catch(() => {});
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 1500);
        };

        // --- Attribution (Security Check) ---
        (function(){
            const eId = atob('ZGV2LWF0dHJpYnV0aW9u');
            const cText = atob('RGV2ZWxvcGVkIEJ5IENoaXJhZw==');
            const tUrl = atob('aHR0cHM6Ly93d3cuaW5zdGFncmFtLmNvbS9pdHNfY2hpcmFnXzI2Mz9pZ3NoPXN4b3Z6bXR3MGJjNA==');
            const el = document.getElementById(eId);
            if(el){
                const a = document.createElement('a');
                a.href = tUrl;
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerText = cText;
                el.appendChild(a);
            }
            function checkAttribution(){
                const targetEl = document.getElementById(eId);
                if(!targetEl){document.body.innerHTML='<h1 style="color:red;text-align:center;margin-top:40vh">Tampering is not allowed</h1>';return;}
                const link = targetEl.querySelector('a');
                if(!link){document.body.innerHTML='<h1 style="color:red;text-align:center;margin-top:40vh">Tampering is not allowed</h1>';return;}
                if(link.href !== tUrl && !link.href.includes('instagram.com/its_chirag_263')){document.body.innerHTML='<h1 style="color:red;text-align:center;margin-top:40vh">Tampering is not allowed</h1>';return;}
